[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matching-de-obras"
version = "1.0.0"
description = "Casamento de obras musicais enviadas por um parceiro com o catálogo próprio: normalização, candidatos, pontuação e revisão"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Bruno Maia" }]
dependencies = ["openpyxl>=3.1", "rapidfuzz>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
matching = "matching.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
